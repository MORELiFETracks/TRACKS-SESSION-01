    </div>

    <div class="errmsg" id="errmsg"></div>
    <div class="glow"></div>

    <div class="btnrow">
      <button class="abtn" id="abtn" type="button" disabled><span id="txtAnalyze">⚡ Analyze</span></button>
      <button class="recbtn" id="recbtn" type="button"><div class="recdot"></div><span id="recLbl">REC</span></button>
    </div>

    <div class="langrow">
      <button class="lbtn on" id="btnEN" type="button">EN</button>
      <button class="lbtn"    id="btnFR" type="button">FR</button>
    </div>

    <!-- ── TAP + MANUAL BPM — always visible ── -->
    <div class="tempo-input-zone" id="tempoInputZone">
      <div class="tempo-input-row">

        <!-- TAP TEMPO -->
        <button class="tapbtn-main" id="tapbtn" type="button">
          <span class="tapbtn-dot"></span>
          <span id="tapBtnLbl">TAP TEMPO</span>
        </button>

        <!-- MANUAL BPM -->
        <div class="bpm-field">
          <input class="bpm-input" type="number" id="bpmInput"
            min="40" max="300" step="1" placeholder="120">
          <button class="bpm-apply" id="bpmApply" type="button">OK</button>
        </div>

      </div>
      <div class="tapc" id="tapc"></div>
    </div>

    <div class="loader" id="loader">
      <div class="lbar"><div class="lfill"></div></div>
      <div class="ltxt" id="ltxt">Initializing…</div>
    </div>

    <div class="rgrid" id="rgrid" style="display:none;">
      <div class="rcell" id="kcell">
        <div class="rlabel" id="lblKey">KEY DETECTOR</div>
        <div class="krow" id="rowMaj"><div class="kbadge maj">MAJOR</div><div class="knote maj mt" id="kMaj">—</div><div class="kpct" id="pMaj"></div></div>
        <div class="krow" id="rowMin"><div class="kbadge min">MINOR</div><div class="knote min mt" id="kMin">—</div><div class="kpct" id="pMin"></div></div>
      </div>
      <div class="rcell" id="bcell">
        <div class="rlabel" id="lblTempo">TEMPO DETECTOR</div>
        <div class="bnum" id="bnum">—</div>
        <div class="bunit">BPM</div>
        <div class="tapc" id="tapc"></div>
      </div>
    </div>

    <div class="sep" id="fxsep" style="display:none;"></div>
    <div class="fxsec" id="fxsec" style="display:none;">
      <div class="fxhdr">
        <div class="fxtitle" id="lblFX">FX SUGGESTIONS</div>
        <div class="fxtabs">
          <button class="fxtab on" id="tRev" type="button">REVERB</button>
          <button class="fxtab"    id="tDly" type="button">DELAY</button>
        </div>
      </div>
      <div class="fxpanel show" id="pRev">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <div style="font-family:'DM Mono',monospace;font-size:8px;color:var(--dim);letter-spacing:.15em;text-transform:uppercase;" id="revUnitLabel">Unit</div>
          <div style="display:flex;gap:3px;">
            <button class="dstab on" id="ruMS"  type="button">MS</button>
            <button class="dstab"    id="ruSEC" type="button">SEC</button>
          </div>
        </div>
        <table class="fxtbl"><thead><tr><th id="thRevName">REVERB SIZE</th><th id="thPD">PRE-DELAY</th><th id="thDC">DECAY</th><th id="thTT">TOTAL</th></tr></thead><tbody id="bodyRev"></tbody></table>
      </div>
      <div class="fxpanel" id="pDly">
        <table class="fxtbl" id="tblDly">
          <thead><tr>
            <th id="thNoteVal">NOTE VALUE</th>
            <th id="thDlyN">NOTES</th>
            <th id="thDlyD">DOTTED</th>
            <th id="thDlyT">TRIPLETS</th>
          </tr></thead>
          <tbody id="bodyDly"></tbody>
        </table>
      </div>
    </div>

    <div class="ftr">
      <div class="fcred">
        <span style="color:var(--text);font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:2px;">TRACK'S SESSION 01</span>
        <span style="display:flex;align-items:baseline;gap:5px;">
          <span style="color:var(--dim);font-family:'DM Mono',monospace;font-size:8px;font-weight:400;letter-spacing:.1em;text-transform:lowercase;">produced by</span>
          <span style="color:var(--vb);font-size:11px;letter-spacing:.12em;">MORE+LiFE</span>
        </span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <div class="chip on">VST3 · AU</div>
        <div class="chip">v1.0</div>
        <div class="dot"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia-wasm.web.js"></script>
<script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia.js-core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia-wasm.web.js"></script>
<script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia.js-core.js"></script>
</body>
</html>
