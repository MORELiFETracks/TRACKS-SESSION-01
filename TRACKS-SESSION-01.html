<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--surface:#0f0f0f;--card:#141414;--border:#1e1e1e;--violet:#9b30ff;--vb:#bf5fff;--vd:#5a1a99;--vg:rgba(155,48,255,0.11);--text:#f0f0f0;--dim:#555;--mid:#888;--red:#ff3a5c;--gold:#ffb830;--r:9px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;min-height:-webkit-fill-available;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px 60px;padding-top:max(28px, env(safe-area-inset-top));padding-bottom:max(60px, env(safe-area-inset-bottom));}
/* Mobile adjustments */
@media(max-width:600px){
  .wrap{width:100%;max-width:540px;}
  .rgrid{grid-template-columns:1fr 1fr;}
  .bnum{font-size:38px;}
  .knote{font-size:20px;}
  .fxtbl td{font-size:9px;padding:6px 5px;}
  .fxtbl th{font-size:6px;padding:4px 5px;}
  .abtn{font-size:11px;}
  input, button{-webkit-tap-highlight-color:transparent;}
}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 55% 35% at 50% 0%,rgba(155,48,255,.06) 0%,transparent 70%);pointer-events:none;z-index:0;}
.wrap{width:540px;position:relative;z-index:1;}
.hdr{text-align:center;margin-bottom:16px;}
.logo-t{font-size:22px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;line-height:1.1;}
.logo-t span{color:var(--vb);}
.logo-s{font-family:'DM Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:.28em;text-transform:uppercase;margin-top:4px;}
.hdr-right{display:none;}
.chip{font-family:'DM Mono',monospace;font-size:8px;padding:3px 8px;border-radius:3px;border:1px solid var(--border);color:var(--dim);}
.chip.on{border-color:var(--vd);color:var(--vb);background:rgba(155,48,255,.06);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--violet);box-shadow:0 0 8px var(--violet);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 0 50px rgba(155,48,255,.05),0 20px 50px rgba(0,0,0,.5);}
.estatus{font-family:'DM Mono',monospace;font-size:8px;text-align:center;padding:7px 16px 6px;color:var(--dim);letter-spacing:.12em;border-bottom:1px solid var(--border);}
.estatus.ok{color:#39d98a;}.estatus.err{color:var(--red);}

/* ── DROP ZONE ── */
.dropzone{margin:14px;border:1.5px dashed var(--border);border-radius:var(--r);padding:18px 14px 16px;text-align:center;transition:border-color .2s,background .2s;background:var(--card);}
.dropzone.over{border-color:var(--violet);background:var(--vg);}
.dropzone.loaded{border-color:var(--violet);background:rgba(155,48,255,.04);}
.di{font-size:22px;margin-bottom:5px;display:block;}
.dt{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;}
.ds{font-family:'DM Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:.1em;margin-bottom:10px;}
.dfmts{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
.dfmt{font-family:'DM Mono',monospace;font-size:8px;padding:2px 6px;border-radius:3px;border:1px solid var(--border);color:var(--dim);}

/* Browse button — <label for="fi">, always works */
.browse-btn{
  display:inline-block;padding:8px 20px;border-radius:var(--r);
  border:1.5px solid var(--vd);color:var(--vb);background:rgba(155,48,255,.08);
  font-family:'Syne',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
  transition:all .18s;user-select:none;
}
.browse-btn:hover{border-color:var(--violet);background:rgba(155,48,255,.16);}

.finfo{display:none;align-items:center;gap:10px;justify-content:center;}
.finfo.show{display:flex;}
.fname{font-family:'DM Mono',monospace;font-size:11px;color:var(--vb);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fclear{width:20px;height:20px;border-radius:50%;background:var(--border);border:none;color:var(--dim);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:all .18s;flex-shrink:0;}
.fclear:hover{background:var(--red);color:#fff;}

.errmsg{font-family:'DM Mono',monospace;font-size:9px;color:var(--red);text-align:center;padding:3px 14px;min-height:18px;letter-spacing:.07em;}
.glow{height:1px;background:linear-gradient(90deg,transparent,var(--vd) 30%,var(--violet) 50%,var(--vd) 70%,transparent);opacity:.4;}

.btnrow{display:flex;align-items:stretch;gap:8px;padding:12px 14px 0;}
.abtn{flex:1;padding:13px 16px;border-radius:var(--r);border:none;background:linear-gradient(135deg,var(--violet),#6b10cc);color:#fff;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.abtn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--vb),var(--violet));opacity:0;transition:opacity .2s;}
.abtn:hover::before{opacity:1;}
.abtn:hover{box-shadow:0 0 24px rgba(155,48,255,.38);transform:translateY(-1px);}
.abtn:active{transform:none;}
.abtn span{position:relative;z-index:1;}
.abtn:disabled{background:var(--border);color:var(--dim);cursor:not-allowed;box-shadow:none;transform:none;}
.abtn:disabled::before{opacity:0;}
.recbtn{display:flex;align-items:center;justify-content:center;gap:7px;padding:0 18px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--card);color:var(--mid);font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .18s;white-space:nowrap;flex-shrink:0;}
.recbtn:hover{border-color:var(--red);color:var(--red);}
.recbtn.rec{border-color:var(--red);color:var(--red);background:rgba(255,58,92,.08);animation:rp 1s infinite;}
.recdot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}
@keyframes rp{0%,100%{box-shadow:0 0 0 0 rgba(255,58,92,.35)}50%{box-shadow:0 0 0 6px rgba(255,58,92,0)}}

.langrow{display:flex;gap:4px;padding:10px 14px 12px;}
.lbtn{font-family:'DM Mono',monospace;font-size:8px;padding:4px 12px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;transition:all .14s;letter-spacing:.1em;text-transform:uppercase;}
.lbtn.on{border-color:var(--violet);color:var(--vb);background:rgba(155,48,255,.09);}

.loader{display:none;flex-direction:column;align-items:center;gap:8px;padding:4px 14px 16px;}
.loader.show{display:flex;}
.lbar{width:100%;height:2px;background:var(--border);border-radius:1px;overflow:hidden;}
.lfill{height:100%;background:linear-gradient(90deg,var(--violet),var(--vb));animation:scan 1.1s ease-in-out infinite;}
@keyframes scan{0%{width:0;margin-left:0}50%{width:55%;margin-left:22%}100%{width:0;margin-left:100%}}
.ltxt{font-family:'DM Mono',monospace;font-size:9px;color:var(--vb);letter-spacing:.2em;text-transform:uppercase;}

.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px;}
.rcell{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px;transition:border-color .28s;}
.rcell.on{border-color:rgba(155,48,255,.26);box-shadow:0 0 16px rgba(155,48,255,.04);}
.rlabel{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
.krow{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:7px;border:1px solid var(--border);margin-bottom:5px;transition:all .22s;}
.krow.best{border-color:var(--violet);background:rgba(155,48,255,.055);}
.kbadge{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.12em;text-transform:uppercase;padding:3px 6px;border-radius:3px;min-width:40px;text-align:center;}
.kbadge.maj{background:rgba(155,48,255,.1);color:var(--vb);border:1px solid var(--vd);}
.kbadge.min{background:rgba(255,184,48,.07);color:var(--gold);border:1px solid rgba(255,184,48,.22);}
.knote{font-size:26px;font-weight:800;line-height:1;flex:1;}
.knote.maj{color:var(--vb);text-shadow:0 0 14px rgba(155,48,255,.32);}
.knote.min{color:var(--gold);text-shadow:0 0 14px rgba(255,184,48,.25);}
.knote.mt{color:var(--border);}
.kpct{font-family:'DM Mono',monospace;font-size:10px;color:var(--mid);padding:2px 5px;border-radius:3px;background:var(--surface);border:1px solid var(--border);}
.krow.best .kpct{color:var(--vb);border-color:var(--vd);background:rgba(155,48,255,.07);}
.bnum{font-size:50px;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--border);}
.bnum.on{color:var(--vb);text-shadow:0 0 28px rgba(155,48,255,.3);}
.bunit{font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.15em;margin-top:2px;margin-bottom:9px;}
/* tapbtn replaced by tapbtn-main */
.tapc{font-family:'DM Mono',monospace;font-size:8px;color:var(--dim);margin-top:6px;text-align:center;}
.sep{height:1px;background:var(--border);margin:0 14px;}
.fxsec{padding:14px;}
.fxhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.fxtitle{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);}
.fxtabs{display:flex;gap:3px;}
.fxtab{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;transition:all .16s;}
.fxtab.on{border-color:var(--violet);color:var(--vb);background:rgba(155,48,255,.09);}
.fxpanel{display:none;}.fxpanel.show{display:block;}
.fxtbl{width:100%;border-collapse:collapse;}
.fxtbl th{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.10em;text-transform:uppercase;color:var(--dim);padding:5px 8px;text-align:right;border-bottom:1px solid var(--border);}
.fxtbl th:first-child{text-align:left;}
.fxtbl tbody tr{border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;transition:background .14s;}
.fxtbl tbody tr:hover{background:rgba(155,48,255,.04);}
.fxtbl tbody tr.sel{background:rgba(155,48,255,.08);}
.fxtbl td{font-family:'DM Mono',monospace;font-size:10px;color:var(--mid);padding:7px 8px;text-align:right;line-height:1.5;vertical-align:middle;}
.fxtbl td:first-child{color:var(--text);font-family:'Syne',sans-serif;font-size:11px;font-weight:600;text-align:left;}
.fxtbl tbody tr.sel td{color:var(--vb);}
.dly-sub{display:flex;gap:3px;margin-bottom:9px;}
.dstab{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;transition:all .14s;}
.dstab.on{border-color:var(--vd);color:var(--vb);background:rgba(155,48,255,.07);}
.ftr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);}

/* ── ALWAYS-VISIBLE TEMPO INPUT ZONE ── */
.tempo-input-zone{padding:0 14px 14px;transition:opacity .3s ease, max-height .3s ease;}

.tempo-input-row{display:flex;gap:8px;align-items:stretch;}

/* TAP button */
.tapbtn-main{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 10px;border-radius:var(--r);
  border:1.5px solid var(--border);background:var(--card);
  color:var(--mid);font-family:'Syne',sans-serif;font-size:10px;
  font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  cursor:pointer;transition:all .15s;user-select:none;
}
.tapbtn-main:hover{border-color:var(--vd);color:var(--vb);}
.tapbtn-main:active{background:var(--vg);border-color:var(--violet);transform:scale(.97);}
.tapbtn-main.tapped{border-color:var(--violet);color:var(--vb);background:var(--vg);}
.tapbtn-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0;}

/* Manual BPM input field */
.bpm-field{flex:1;display:flex;gap:5px;align-items:stretch;}
.bpm-input{
  flex:1;padding:0 10px;border-radius:7px;
  border:1.5px solid var(--border);background:var(--card);
  color:var(--text);font-family:'DM Mono',monospace;font-size:15px;
  font-weight:500;text-align:center;
  outline:none;transition:border-color .15s;
  -moz-appearance:textfield;height:auto;
}
.bpm-input::-webkit-outer-spin-button,
.bpm-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.bpm-input:focus{border-color:var(--violet);}
.bpm-input::placeholder{color:var(--dim);}
.bpm-apply{
  padding:0 16px;border-radius:7px;border:none;
  background:linear-gradient(135deg,var(--violet),#6b10cc);
  color:#fff;font-family:'Syne',sans-serif;font-size:10px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;transition:all .18s;white-space:nowrap;flex-shrink:0;
}
.bpm-apply:hover{box-shadow:0 0 14px rgba(155,48,255,.4);}

/* tap feedback line */
.tapc{font-family:'DM Mono',monospace;font-size:8px;color:var(--dim);
  margin-top:6px;text-align:center;letter-spacing:.1em;min-height:14px;}

/* ── TEMPO BLOCK (before file zone) ── */
.tempo-block{padding:14px 14px 0;}
.tempo-row{display:flex;gap:8px;align-items:stretch;}

/* Tap button */
.tap-big{
  flex:1;padding:14px 10px;border-radius:var(--r);

  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.tap-big:hover{border-color:var(--vd);color:var(--vb);}
.tap-big:active{background:var(--vg);border-color:var(--violet);transform:scale(.98);}
.tap-big.tapped{border-color:var(--violet);color:var(--vb);background:var(--vg);}
.tap-sub{font-family:'DM Mono',monospace;font-size:8px;color:var(--dim);letter-spacing:.15em;font-weight:400;}

/* Manual BPM input group */
.bpm-input-group{
  flex:1;display:flex;flex-direction:column;gap:6px;
}
.bpm-input-label{
  font-family:'DM Mono',monospace;font-size:8px;color:var(--dim);
  letter-spacing:.2em;text-transform:uppercase;
}
.bpm-input-row{display:flex;gap:4px;align-items:center;}
.bpm-input{
  flex:1;padding:7px 8px;border-radius:7px;
  border:1.5px solid var(--border);background:var(--surface);
  color:var(--text);font-family:'DM Mono',monospace;font-size:13px;
  font-weight:500;letter-spacing:.05em;text-align:center;
  outline:none;transition:border-color .15s;
  -moz-appearance:textfield;
}
.bpm-input::-webkit-outer-spin-button,
.bpm-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.bpm-input:focus{border-color:var(--violet);}
.bpm-input::placeholder{color:var(--dim);}
.bpm-apply{
  padding:7px 12px;border-radius:7px;border:none;
  background:linear-gradient(135deg,var(--violet),#6b10cc);
  color:#fff;font-family:'Syne',sans-serif;font-size:9px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;transition:all .18s;white-space:nowrap;flex-shrink:0;
}
.bpm-apply:hover{box-shadow:0 0 16px rgba(155,48,255,.4);}

/* BPM display badge (under tap+input) */
.tempo-result{
  margin-top:10px;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:var(--card);border-radius:var(--r);
  border:1px solid var(--border);transition:border-color .28s;
}
.tempo-result.on{border-color:rgba(155,48,255,.3);}
.tempo-bpm-big{font-size:36px;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--border);}
.tempo-bpm-big.on{color:var(--vb);text-shadow:0 0 20px rgba(155,48,255,.3);}
.tempo-bpm-unit{font-family:'DM Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:.2em;}
.tempo-tap-info{font-family:'DM Mono',monospace;font-size:8px;color:var(--dim);margin-top:3px;}
.tempo-sep{width:1px;height:40px;background:var(--border);flex-shrink:0;}
.tempo-src{font-family:'DM Mono',monospace;font-size:8px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;}
.tempo-src span{color:var(--vb);}
.fcred{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;color:var(--text);letter-spacing:.1em;text-transform:uppercase;display:flex;flex-direction:column;gap:0;}
.fcred span{color:var(--violet);}
.fver{font-family:'DM Mono',monospace;font-size:8px;color:var(--dim);}
</style>

          <span id="browseBtn" style="display:inline-block;padding:8px 22px;border-radius:9px;border:1.5px solid #5a1a99;color:#bf5fff;background:rgba(155,48,255,.09);font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;">📂 Browse file</span>

/* ── NOTES ───────────────────────────────────── */
const N_EN=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const N_FR=['Do','Do#','Ré','Mib','Mi','Fa','Fa#','Sol','Lab','La','Sib','Si'];
const KEY2IDX={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const noteLabel=k=>(lang==='FR'?N_FR:N_EN)[KEY2IDX[k]??0];

/* ── ESSENTIA ─────────────────────────────────── */
let essentia=null,esReady=false;
EssentiaWASM().then(wasm=>{
  essentia=new Essentia(wasm);esReady=true;
  const el=document.getElementById('estatus');
  el.textContent=L().engOK;el.className='estatus ok';
  setTimeout(()=>el.style.display='none',3000);
}).catch(()=>{
  const el=document.getElementById('estatus');
  el.textContent=L().engErr;el.className='estatus err';
});

/* ── AUDIO CTX ───────────────────────────────── */
let audioCtx=null,audioBuf=null;
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}

/* ── FILE INPUT ──────────────────────────── */
// <label for="fi"> opens picker natively via HTML.
// input#fi is display:none, linked via for/id.
const fi = document.getElementById('fi');

fi.addEventListener('change', function() {
  if (this.files && this.files.length > 0) {
    loadAudio(this.files[0]);
  }
  this.value = '';
});

// Drag & drop on the label zone
const lbl = document.getElementById('fileLabel');
['dragenter','dragover'].forEach(ev => {
  lbl.addEventListener(ev, function(e) {
    e.preventDefault(); e.stopPropagation();
    lbl.style.borderColor = '#9b30ff';
    lbl.style.background = 'rgba(155,48,255,0.11)';
  });
});
lbl.addEventListener('dragleave', function(e) {
  e.stopPropagation();
  if (!lbl.contains(e.relatedTarget)) {
    lbl.style.borderColor = '';
    lbl.style.background = '';
  }
});
lbl.addEventListener('drop', function(e) {
  e.preventDefault(); e.stopPropagation();
  lbl.style.borderColor = '';
  lbl.style.background = '';
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadAudio(f);
});

// Fallback: catch drops anywhere on the page
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', function(e) {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadAudio(f);
});

document.getElementById('fclear').addEventListener('click', function(e) {
  e.preventDefault();
  e.stopPropagation();
  clearAudio();
});

/* ── LOAD AUDIO ──────────────────────────── */
async function loadAudio(file) {
  hideErr();
  // Show a loading indicator on the label
  const lbl = document.getElementById('fileLabel');
  lbl.style.borderColor = '#9b30ff';
  try {
    const ctx = getCtx();
    if (ctx.state === 'suspended') await ctx.resume();
    const ab = await file.arrayBuffer();

    // Strategy 1: native decodeAudioData (handles MP3, WAV, AAC, OGG, FLAC on modern browsers)
    let decoded = null;
    try {
      decoded = await ctx.decodeAudioData(ab.slice(0));
    } catch(e1) {
      console.warn('Native decode failed, trying fallback...', e1);
    }

    // Strategy 2: if native fails, try repackaging as different MIME and retry
    if (!decoded) {
      const mimes = ['audio/wav','audio/mpeg','audio/ogg','audio/aac','audio/flac','audio/x-aiff'];
      for (const mime of mimes) {
        try {
          const blob = new Blob([ab], {type: mime});
          const ab2 = await blob.arrayBuffer();
          decoded = await ctx.decodeAudioData(ab2);
          if (decoded) break;
        } catch(e2) { /* try next */ }
      }
    }

    if (!decoded) throw new Error('All decode strategies failed');

    audioBuf = decoded;
    showLoaded(file.name);
    document.getElementById('abtn').disabled = false;
  } catch(err) {
    // Reset label style on failure
    lbl.style.borderColor = '';
    lbl.style.background = '';
    showErr(L().errDecode + ' (' + (file.name.split('.').pop().toUpperCase()) + ')');
    console.error('Audio decode error:', err);
  }
}

function showLoaded(name) {
  document.getElementById('ddef').style.display = 'none';
  document.getElementById('finfo').style.display = 'flex';
  document.getElementById('fname').textContent = name;
  // Hide tap+manual when a file is loaded
  const tz = document.getElementById('tempoInputZone');
  if (tz) { tz.style.opacity = '0'; tz.style.pointerEvents = 'none'; tz.style.maxHeight = '0'; tz.style.overflow = 'hidden'; tz.style.marginBottom = '0'; tz.style.transition = 'all .3s ease'; }
  const lbl = document.getElementById('fileLabel');
  lbl.style.borderColor = '#9b30ff';
  lbl.style.background = 'rgba(155,48,255,0.04)';
  lbl.style.cursor = 'default';
  lbl.removeAttribute('for'); // unlink so clicking loaded zone won't reopen picker
  document.getElementById('fclearWrap').style.display = 'block';
}

function clearAudio() {
  document.getElementById('ddef').style.display = '';
  document.getElementById('finfo').style.display = 'none';
  // Show tap+manual again when file is cleared
  const tz = document.getElementById('tempoInputZone');
  if (tz) { tz.style.opacity = ''; tz.style.pointerEvents = ''; tz.style.maxHeight = ''; tz.style.overflow = ''; tz.style.marginBottom = ''; }
  const lbl = document.getElementById('fileLabel');
  lbl.style.borderColor = '';
  lbl.style.background = '';
  lbl.style.cursor = '';
  lbl.setAttribute('for', 'fi'); // re-link to input
  document.getElementById('fclearWrap').style.display = 'none';
  fi.value = '';
  audioBuf = null; lastKey = null; lastBPM = null;
  document.getElementById('abtn').disabled = true;
  hideErr(); hideResults();
}
function showErr(m){document.getElementById('errmsg').textContent='⚠ '+m;}
function hideErr(){document.getElementById('errmsg').textContent='';}

/* ── WAVEFORM ─────────────────────────────────── */


/* ── TAP TEMPO ───────────────────────────────── */
/* ─── TEMPO BLOCK ────────────────────────────── */
let tapTimes=[], tapTimer=null;

// Central function: set BPM from any source
function setBPM(bpm, source) {
  lastBPM = bpm;
  // Update BPM display in results cell
  const bn = document.getElementById('bnum');
  if (bn) { bn.textContent = bpm; bn.classList.add('on'); }
  // Show FX immediately
  document.getElementById('fxsep').style.display = 'block';
  document.getElementById('fxsec').style.display = 'block';
  renderFX(bpm);
  // Show results grid (BPM cell) even without full audio analysis
  const rg = document.getElementById('rgrid');
  if (rg && rg.style.display === 'none') {
    rg.style.display = 'grid';
    document.getElementById('bcell').classList.add('on');
  }
}

// TAP TEMPO
document.getElementById('tapbtn').addEventListener('click', function() {
  const now = performance.now();
  tapTimes.push(now);
  clearTimeout(tapTimer);
  const self = this;
  tapTimer = setTimeout(() => {
    tapTimes = [];
    document.getElementById('tapc').textContent = '';
    self.classList.remove('tapped');
  }, 2500);
  this.classList.add('tapped');
  if (tapTimes.length > 1) {
    const ivs = [];
    for (let i=1; i<tapTimes.length; i++) ivs.push(tapTimes[i]-tapTimes[i-1]);
    const avg = ivs.reduce((a,b)=>a+b,0)/ivs.length;
    let bpm = Math.round(60000/avg);
    while(bpm < 40) bpm *= 2; while(bpm > 300) bpm = Math.round(bpm/2);
    document.getElementById('tapc').textContent = tapTimes.length+' taps · '+avg.toFixed(0)+' ms';
    setBPM(bpm, 'TAP');
  } else {
    document.getElementById('tapc').textContent = '1 tap…';
  }
});

// MANUAL BPM
function applyManualBPM() {
  const inp = document.getElementById('bpmInput');
  const val = parseInt(inp.value, 10);
  if (!val || val < 40 || val > 300) {
    inp.style.borderColor = 'var(--red)';
    setTimeout(() => { inp.style.borderColor = ''; }, 900);
    return;
  }
  setBPM(val, 'MANUAL');
  inp.blur();
}
document.getElementById('bpmApply').addEventListener('click', applyManualBPM);
document.getElementById('bpmInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') applyManualBPM();
});

document.getElementById('btnEN').addEventListener('click',()=>setLang('EN'));

/* ── RESAMPLE ────────────────────────────────── */
async function resampleTo44100(mono,fromSr){
  const len=Math.ceil(mono.length*44100/fromSr);
  const off=new OfflineAudioContext(1,len,44100);
  const b=off.createBuffer(1,mono.length,fromSr);b.copyToChannel(mono,0);
  const src=off.createBufferSource();src.buffer=b;src.connect(off.destination);src.start(0);
  return(await off.startRendering()).getChannelData(0);
}

/* ── ANALYZE ─────────────────────────────────── */
let lastKey=null,lastBPM=null;
async function analyze(){
  if(!audioBuf)return;
  if(!esReady){showErr(L().errEngine);return;}
  hideErr();hideResults();
  document.getElementById('loader').classList.add('show');
  document.getElementById('abtn').disabled=true;
  const steps=L().ltxt;
  for(let i=0;i<steps.length;i++){document.getElementById('ltxt').textContent=steps[i];await sleep(250+Math.random()*120);}
  try{
    let mono;
    if(audioBuf.numberOfChannels===1){mono=audioBuf.getChannelData(0).slice();}
    else{const Lc=audioBuf.getChannelData(0),Rc=audioBuf.getChannelData(1);mono=new Float32Array(Lc.length);for(let i=0;i<Lc.length;i++)mono[i]=(Lc[i]+Rc[i])*0.5;}
    if(audioBuf.sampleRate!==44100)mono=await resampleTo44100(mono,audioBuf.sampleRate);
    const vec=essentia.arrayToVector(mono);
    const kr=essentia.KeyExtractor(vec);
    let majorKey,majorStrength,minorKey,minorStrength;
    if(kr.scale==='major'){majorKey=kr.key;majorStrength=kr.strength;minorKey=N_EN[((KEY2IDX[kr.key]??0)+9)%12];minorStrength=Math.max(0.04,majorStrength*0.80);}
    else{minorKey=kr.key;minorStrength=kr.strength;majorKey=N_EN[((KEY2IDX[kr.key]??0)+3)%12];majorStrength=Math.max(0.04,minorStrength*0.80);}
    lastKey={majorKey,majorStrength,minorKey,minorStrength,bestIsMajor:kr.scale==='major'};
    let bpm;
    try{bpm=essentia.RhythmExtractor2013(vec).bpm;}catch(e2){bpm=essentia.PercivalBpmEstimator(vec).bpm;}
    bpm=Math.round(bpm);while(bpm>0&&bpm<80)bpm*=2;while(bpm>180)bpm=Math.round(bpm/2);
    vec.delete();
    document.getElementById('loader').classList.remove('show');
    document.getElementById('rgrid').style.display='grid';
    document.getElementById('kcell').classList.add('on');
    document.getElementById('bcell').classList.add('on');
    document.getElementById('abtn').disabled=false;
    renderKey(lastKey);
    setBPM(bpm, 'ANALYSIS');  // sets lastBPM, updates top display, shows FX
  }catch(err){
    document.getElementById('loader').classList.remove('show');
    document.getElementById('abtn').disabled=false;
    showErr(L().errAnalyze+(err.message||String(err)));console.error(err);
  }
}

/* ── RENDER KEY ──────────────────────────────── */
function renderKey(k){
  const mj=noteLabel(k.majorKey),mn=noteLabel(k.minorKey);
  const mjP=Math.round(k.majorStrength*100),mnP=Math.round(k.minorStrength*100);
  const eM=document.getElementById('kMaj');eM.textContent=mj;eM.classList.remove('mt');
  document.getElementById('pMaj').textContent=mjP+'%';
  const em=document.getElementById('kMin');em.textContent=mn+'m';em.classList.remove('mt');
  document.getElementById('pMin').textContent=mnP+'%';
  document.getElementById('rowMaj').className='krow'+(k.bestIsMajor?' best':'');
  document.getElementById('rowMin').className='krow'+(!k.bestIsMajor?' best':'');
}

/* ── FX ──────────────────────────────────────── */

function calcReverb(bpm){const q=60000/bpm;return[q*8,q*4,q*2,q].map((ref,i)=>{const pd=+(ref/32).toFixed(2),dc=+(ref*1.969/2).toFixed(2),tt=+(pd+dc).toFixed(2);return{name:L().revNames[i],pd:pd+' ms',dc:dc+' ms',tt:tt+' ms'};});}
/* reverb unit toggle */
let revUnit = 'ms';
function fmtRev(ms) {
  return revUnit === 'sec' ? (ms/1000).toFixed(3)+' s' : ms+' ms';
}

function calcDelay(bpm) {
  const q = 60000/bpm;
  const bases = [q*4,q*2,q,q/2,q/4,q/8,q/16];
  const hz = v => v>0 ? +(1000/v).toFixed(2) : 0;
  return bases.map((ms,i)=>{
    const n=+ms.toFixed(2), d=+(ms*1.5).toFixed(2), t=+(ms*(2/3)).toFixed(2);
    return {name:L().noteNames[i], n, nhz:hz(n), d, dhz:hz(d), t, thz:hz(t)};
  });
}

function fmtCell(ms, hz) {
  return ms+' ms<br><span style="font-size:8px;color:var(--dim);">'+hz+' Hz</span>';
}

function renderFX(bpm) {
  const br = document.getElementById('bodyRev');
  br.innerHTML = '';
  calcReverb(bpm).forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>'+r.name+'</td><td>'+fmtRev(parseFloat(r.pd))+'</td><td>'+fmtRev(parseFloat(r.dc))+'</td><td>'+fmtRev(parseFloat(r.tt))+'</td>';
    tr.onclick = ()=>{ br.querySelectorAll('tr').forEach(x=>x.classList.remove('sel')); tr.classList.add('sel'); };
    br.appendChild(tr);
  });
  renderDelay(bpm);
  ['thRevName','thPD','thDC','thTT','thNoteVal'].forEach(id=>{
    const e=document.getElementById(id); if(e) e.textContent=L()[id];
  });
  const dn=document.getElementById('thDlyN'); if(dn) dn.textContent=lang==='FR'?'NOTES':'NOTES';
  const dd=document.getElementById('thDlyD'); if(dd) dd.textContent=L().stD||'DOTTED';
  const dt=document.getElementById('thDlyT'); if(dt) dt.textContent=L().stT||'TRIPLETS';
  const ru=document.getElementById('revUnitLabel'); if(ru) ru.textContent=lang==='FR'?'Unité':'Unit';
}

function renderDelay(bpm) {
  const bd = document.getElementById('bodyDly');
  bd.innerHTML = '';
  calcDelay(bpm).forEach(d=>{
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>'+d.name+'</td><td>'+fmtCell(d.n,d.nhz)+'</td><td>'+fmtCell(d.d,d.dhz)+'</td><td>'+fmtCell(d.t,d.thz)+'</td>';
    tr.onclick = ()=>{ bd.querySelectorAll('tr').forEach(x=>x.classList.remove('sel')); tr.classList.add('sel'); };
    bd.appendChild(tr);
  });
}

function switchRevUnit(u) {
  revUnit = u;
  document.getElementById('ruMS').className  = 'dstab'+(u==='ms' ?' on':'');
  document.getElementById('ruSEC').className = 'dstab'+(u==='sec'?' on':'');
  if(lastBPM!==null) renderFX(lastBPM);
}

function switchDly(m){} /* kept for compat */

function switchFx(tab){
  document.getElementById('tRev').className='fxtab'+(tab==='rev'?' on':'');
  document.getElementById('tDly').className='fxtab'+(tab==='dly'?' on':'');
  document.getElementById('pRev').className='fxpanel'+(tab==='rev'?' show':'');
  document.getElementById('pDly').className='fxpanel'+(tab==='dly'?' show':'');
}

/* ── HIDE RESULTS ────────────────────────────── */
function hideResults(){
  document.getElementById('rgrid').style.display='none';
  document.getElementById('fxsep').style.display='none';
  document.getElementById('fxsec').style.display='none';
  ['kcell','bcell'].forEach(id=>document.getElementById(id).classList.remove('on'));
  ['kMaj','kMin'].forEach(id=>{document.getElementById(id).textContent='—';document.getElementById(id).classList.add('mt');});
  ['pMaj','pMin'].forEach(id=>document.getElementById(id).textContent='');
  document.getElementById('rowMaj').className='krow';
  document.getElementById('rowMin').className='krow';
  document.getElementById('bnum').textContent='—';
  document.getElementById('bnum').classList.remove('on');
  document.getElementById('tapc').textContent='';
  tapTimes=[];
  lastBPM=null;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
setLang('EN');
